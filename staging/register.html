<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS สมัครสมาชิก · Email OTP</title><style>body{font:16px system-ui,Tahoma;background:#f2f6fc;color:#1d3558;min-height:95vh;display:grid;place-items:center}main{background:#fff;padding:28px;border-radius:16px;width:min(460px,90vw);box-shadow:0 4px 24px #0001}input,button{display:block;box-sizing:border-box;width:100%;padding:12px;margin:10px 0;border:1px solid #ccd6e5;border-radius:8px}button{background:#2453b8;color:#fff;cursor:pointer}button:disabled{opacity:.5}small{color:#63728b}#status{white-space:pre-wrap}a{color:#2453b8}</style></head><body><main><h2>สมัครสมาชิก AMS Dashboard</h2><p><small>ยืนยันอีเมลด้วยรหัส OTP 6 หลัก ก่อนสร้างบัญชี · ไม่สามารถใช้ Alarm หรือจัดการผู้ใช้ได้</small></p><form id="start"><input id="username" placeholder="Username (3–40 ตัวอักษร)" minlength="3" maxlength="40" required><input id="name" placeholder="ชื่อที่แสดง" maxlength="100" required><input id="email" type="email" placeholder="อีเมลที่รับ OTP" required><input id="password" type="password" placeholder="รหัสผ่าน (อย่างน้อย 12 ตัวอักษร)" minlength="12" maxlength="128" autocomplete="new-password" required><button type="submit">ส่ง OTP ไปยังอีเมล</button></form><form id="confirm" hidden><p>กรอกรหัส 6 หลักที่ส่งไปยังอีเมลของคุณ (หมดอายุใน 10 นาที)</p><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="OTP 6 หลัก" required><button type="submit">ยืนยัน OTP และสร้างบัญชี</button><button id="back" type="button">แก้ไขข้อมูลสมัคร</button></form><p id="status" role="status"></p><p><a href="./login.html">กลับหน้า Login</a></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const api='https://ams-dashboard-api.pchancheam.workers.dev';async function send(path,data){const r=await fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}let email='';$('start').onsubmit=async e=>{e.preventDefault();const btn=$('start').querySelector('button');btn.disabled=true;$('status').textContent='กำลังส่ง OTP...';try{email=$('email').value.trim().toLowerCase();await send('/auth/register/request',{username:$('username').value.trim(),display_name:$('name').value.trim(),email,password:$('password').value});$('password').value='';$('start').hidden=true;$('confirm').hidden=false;$('status').textContent='ส่ง OTP แล้ว กรุณาตรวจสอบอีเมล'}catch(err){$('status').textContent='ไม่สามารถส่ง OTP: '+err.message}finally{btn.disabled=false}};$('confirm').onsubmit=async e=>{e.preventDefault();const btn=$('confirm').querySelector('button');btn.disabled=true;try{await send('/auth/register/verify',{email,otp:$('otp').value});$('confirm').hidden=true;$('status').textContent='ยืนยันสำเร็จ! สมัครสมาชิกเรียบร้อยแล้ว กรุณากลับไป Login'}catch(err){$('status').textContent='ยืนยันไม่สำเร็จ: '+err.message}finally{btn.disabled=false}};$('back').onclick=()=>{$('confirm').hidden=true;$('start').hidden=false;$('status').textContent=''};})();</script></body></html>
