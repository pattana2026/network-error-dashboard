<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS เปลี่ยนรหัสผ่าน</title><style>body{font:16px system-ui,Tahoma;background:#f1f5fb;color:#17315b;display:grid;place-items:center;min-height:95vh}main{background:white;padding:28px;border-radius:14px;width:min(440px,90vw);box-shadow:0 4px 24px #0001}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:7px;border:1px solid #cbd5e1}button{background:#2453ba;color:white;cursor:pointer}button:disabled{opacity:.5}#message{white-space:pre-wrap}</style><main><h2>AMS — เปลี่ยนรหัสผ่านของฉัน</h2><p>ผู้ใช้งานทุกคนสามารถเปลี่ยนรหัสผ่านของตัวเองได้ โดยไม่ต้องติดต่อ Admin</p><form id="form"><input id="username" placeholder="Username" autocomplete="username" required><input id="current" type="password" placeholder="รหัสผ่านปัจจุบัน" autocomplete="current-password" required><input id="next" type="password" placeholder="รหัสผ่านใหม่ อย่างน้อย 12 ตัวอักษร" autocomplete="new-password" minlength="12" maxlength="128" required><input id="confirm" type="password" placeholder="ยืนยันรหัสผ่านใหม่" autocomplete="new-password" minlength="12" maxlength="128" required><button>เปลี่ยนรหัสผ่าน</button></form><p id="message" role="status"></p><a href="./index.html">กลับ Dashboard</a></main><script>(()=>{'use strict';const api='https://ams-dashboard-api.pchancheam.workers.dev';const $=id=>document.getElementById(id);async function req(path,body,token){const r=await fetch(api+path,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'HTTP '+r.status);return d} $('form').onsubmit=async e=>{e.preventDefault();const b=$('form').querySelector('button');b.disabled=true;$('message').textContent='กำลังดำเนินการ...';try{if($('next').value!==$('confirm').value)throw Error('รหัสผ่านใหม่ไม่ตรงกัน');const current=$('current').value;const login=await req('/auth/login',{username:$('username').value.trim(),password:current});if(!login.token)throw Error('เข้าสู่ระบบไม่สำเร็จ');await req('/auth/change-password',{old_password:current,new_password:$('next').value},login.token);$('form').reset();$('message').textContent='เปลี่ยนรหัสผ่านสำเร็จ กรุณาเข้าสู่ Dashboard ด้วยรหัสผ่านใหม่'}catch(err){$('message').textContent='ไม่สำเร็จ: '+err.message}finally{b.disabled=false}}})();</script></html>
