<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS Login Test</title><style>body{font:16px system-ui,Tahoma;background:#f2f6fc;color:#1d3558;display:grid;place-items:center;min-height:95vh}main{background:white;border-radius:14px;padding:28px;width:min(400px,90vw);box-shadow:0 4px 20px #0001}input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border-radius:7px;border:1px solid #ccd6e5}button{background:#2453b8;color:white;cursor:pointer}#message{white-space:pre-wrap}</style></head><body><main><h2>AMS Central Login · Test</h2><form id="form"><input id="user" placeholder="Username" autocomplete="username" required><input id="pass" placeholder="Password" type="password" autocomplete="current-password" required><button>Login</button></form><div id="message"></div><p id="admin" hidden><a href="admin.html">User Management</a></p><section id="access" hidden><h3>สิทธิ์การใช้งาน</h3><div id="modules"></div><p id="dashboardNotice"></p></section><form id="change" hidden><h3>ต้องเปลี่ยนรหัสผ่านก่อนใช้งาน</h3><input id="old" type="password" placeholder="รหัสผ่านปัจจุบัน" required><input id="next" type="password" placeholder="รหัสผ่านใหม่ (อย่างน้อย 12 ตัวอักษร)" minlength="12" required><button type="submit">เปลี่ยนรหัสผ่าน</button></form><button id="logout" hidden>Logout</button><p><small>ทดสอบระบบยืนยันตัวตนเท่านั้น ไม่ใช่ Dashboard จริง</small></p></main><script>
(()=>{'use strict';let token=null,current=null;const $=id=>document.getElementById(id);const base='https://ams-dashboard-api.pchancheam.workers.dev';
async function api(path,method='GET',body){const r=await fetch(base+path,{method,cache:'no-store',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||'HTTP '+r.status);return j}
function show(me){current=me.user;$('form').hidden=true;$('pass').value='';$('logout').hidden=false;$('message').textContent='เข้าสู่ระบบสำเร็จ: '+current.username+' ('+current.role+')';const forced=!!current.must_change_password;$('change').hidden=!forced;$('access').hidden=forced;$('admin').hidden=forced||current.role!=='admin';if(forced){$('message').textContent+=' — ต้องเปลี่ยนรหัสผ่านก่อนใช้งาน';return}const permitted=current.role==='admin'?['network_error','contract','alarm','station_master','remark','analysis']:(me.permissions||[]).filter(p=>p.can_view).map(p=>p.module_key);$('modules').replaceChildren();if(!permitted.length)$('modules').textContent='ยังไม่มีสิทธิ์เข้าดู Module';else for(const m of permitted){const el=document.createElement('p');el.textContent='✓ '+m+' (View)';$('modules').appendChild(el)}$('dashboardNotice').textContent='ผ่านการตรวจสอบสิทธิ์จาก API แล้ว — การเชื่อม Dashboard จริงยังอยู่ระหว่างพัฒนาใน Staging';}
$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='กำลังเข้าสู่ระบบ';try{const r=await api('/auth/login','POST',{username:$('user').value.trim(),password:$('pass').value});token=r.token;if(!token)throw Error('No token');const me=await api('/auth/me');if(!me.user)throw Error('No user');show(me)}catch(err){token=null;$('message').textContent='Login failed: '+err.message}};
$('change').onsubmit=async e=>{e.preventDefault();try{await api('/auth/change-password','POST',{old_password:$('old').value,new_password:$('next').value});$('old').value='';$('next').value='';show(await api('/auth/me'));$('message').textContent='เปลี่ยนรหัสผ่านสำเร็จ: '+current.username+' ('+current.role+')'}catch(err){$('message').textContent='เปลี่ยนรหัสผ่านไม่สำเร็จ: '+err.message}};
$('logout').onclick=async()=>{try{await api('/auth/logout','POST')}catch(e){}token=null;current=null;$('form').hidden=false;$('change').hidden=true;$('access').hidden=true;$('admin').hidden=true;$('logout').hidden=true;$('message').textContent='ออกจากระบบแล้ว'};})();
</script></body></html>
