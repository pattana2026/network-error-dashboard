<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS Login Test</title><style>body{font:16px system-ui,Tahoma;background:#f2f6fc;color:#1d3558;display:grid;place-items:center;min-height:95vh}main{background:white;border-radius:14px;padding:28px;width:min(400px,90vw);box-shadow:0 4px 20px #0001}input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border-radius:7px;border:1px solid #ccd6e5}button{background:#2453b8;color:white;cursor:pointer}#message{white-space:pre-wrap}</style></head><body><main><h2>AMS Central Login · Test</h2><form id="form"><input id="user" placeholder="Username" autocomplete="username" required><input id="pass" placeholder="Password" type="password" autocomplete="current-password" required><button>Login</button></form><div id="message"></div><p id="admin" hidden><a href="admin.html">User Management</a></p><button id="logout" hidden>Logout</button><p><small>ทดสอบระบบยืนยันตัวตนเท่านั้น ไม่ใช่ Dashboard จริง</small></p></main><script>
(()=>{let token=null;const $=id=>document.getElementById(id);const base='https://ams-dashboard-api.pchancheam.workers.dev';
async function api(path,method='GET',body){const r=await fetch(base+path,{method,cache:'no-store',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||j.error||'HTTP '+r.status);return j}
$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='กำลังเข้าสู่ระบบ';try{const r=await api('/auth/login','POST',{username:$('user').value.trim(),password:$('pass').value});token=r.token;if(!token)throw Error('No token');const me=await api('/auth/me');if(!me.user)throw Error('No user');$('message').textContent='เข้าสู่ระบบสำเร็จ: '+me.user.username+' ('+me.user.role+')';$('form').hidden=true;$('pass').value='';$('admin').hidden=me.user.role!=='admin';$('logout').hidden=false}catch(err){token=null;$('message').textContent='Login failed: '+err.message}};
$('logout').onclick=async()=>{try{await api('/auth/logout','POST')}catch(e){}token=null;$('form').hidden=false;$('admin').hidden=true;$('logout').hidden=true;$('message').textContent='ออกจากระบบแล้ว'};})();
</script></body></html>
